name: Deploy privacy policy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-privacy-policy.yml"
      - "privacy-policy.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare privacy policy site
        run: |
          mkdir -p _site
          cp privacy-policy.html _site/privacy-policy.html
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./privacy-policy.html">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>NearWake Privacy Policy</title>
            <link rel="canonical" href="./privacy-policy.html">
          </head>
          <body>
            <p>Redirecting to <a href="./privacy-policy.html">NearWake Privacy Policy</a>...</p>
          </body>
          </html>
          EOF
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
